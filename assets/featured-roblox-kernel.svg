<svg xmlns="http://www.w3.org/2000/svg" width="690" height="132" viewBox="0 0 690 132">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1526"/>
      <stop offset="1" stop-color="#140c26"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF5E7E"/>
    </linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="0.5" stop-color="#7B2FF7"/>
      <stop offset="1" stop-color="#00A2FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB547" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFB547" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="clip"><rect x="1" y="1" width="688" height="130" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="690" height="132" fill="url(#bg)"/>
    <circle cx="56" cy="66" r="90" fill="url(#glow)"/>
    <circle cx="660" cy="14" r="2" fill="#00A2FF" opacity="0.6"/>
    <circle cx="644" cy="26" r="1.5" fill="#7B2FF7" opacity="0.6"/>
    <circle cx="670" cy="34" r="1" fill="#ffffff" opacity="0.4"/>
    <rect x="-160" y="0" width="120" height="132" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-160;820;820" keyTimes="0;0.35;1" dur="7s" begin="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="4" height="132" fill="url(#ac)"/>
  </g>
  <rect x="1" y="1" width="688" height="130" rx="16" fill="none" stroke="url(#bd)" stroke-opacity="0.6" stroke-width="1.5"/>
  <rect x="26" y="36" width="60" height="60" rx="15" fill="url(#ac)" filter="url(#blur)" opacity="0.55"/>
  <rect x="26" y="36" width="60" height="60" rx="15" fill="url(#ac)"/>
  <rect x="27" y="37" width="58" height="28" rx="14" fill="#ffffff" opacity="0.12"/>
  <text x="56" y="76" font-size="28" text-anchor="middle" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">⚡</text>
  <text x="108" y="50" font-size="20" font-weight="700" fill="url(#ac)" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">roblox-kernel</text>
  <rect x="108" y="58" width="34" height="2" rx="1" fill="url(#ac)" opacity="0.8"/>
  <text x="108" y="80" font-size="13.5" fill="#c2cbe0" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">Runtime foundation for Roblox games: startup phases, events, tasks,</text>
  <text x="108" y="99" font-size="13.5" fill="#c2cbe0" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">cleanup and lazy utilities in one ReplicatedFirst module.</text>
  <rect x="566" y="22" width="98" height="26" rx="13" fill="#00A2FF" fill-opacity="0.15" stroke="#00A2FF" stroke-opacity="0.6"/>
  <circle cx="584" cy="35" r="5" fill="#00A2FF"/>
  <text x="596" y="40" font-size="12.5" font-weight="600" fill="#7cc8ff" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">Luau</text>
  <text x="664" y="112" font-size="12.5" font-weight="600" fill="#FFB547" text-anchor="end" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">Open repo</text>
</svg>
