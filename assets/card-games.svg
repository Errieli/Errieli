<svg xmlns="http://www.w3.org/2000/svg" width="340" height="112" viewBox="0 0 340 112">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1526"/>
      <stop offset="1" stop-color="#140c26"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C6FF"/>
      <stop offset="1" stop-color="#0072FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00C6FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00C6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="clip"><rect x="1" y="1" width="338" height="110" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="340" height="112" fill="url(#bg)"/>
    <circle cx="46" cy="56" r="70" fill="url(#glow)"/>
    <circle cx="318" cy="10" r="2" fill="#0072FF" opacity="0.6"/>
    <circle cx="304" cy="20" r="1.5" fill="#00C6FF" opacity="0.5"/>
    <circle cx="326" cy="28" r="1" fill="#ffffff" opacity="0.4"/>
    <rect x="-120" y="0" width="90" height="112" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-120;460;460" keyTimes="0;0.35;1" dur="7s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="4" height="112" fill="url(#ac)"/>
  </g>
  <rect x="1" y="1" width="338" height="110" rx="14" fill="none" stroke="url(#ac)" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="22" y="32" width="48" height="48" rx="12" fill="url(#ac)" filter="url(#blur)" opacity="0.55"/>
  <rect x="22" y="32" width="48" height="48" rx="12" fill="url(#ac)"/>
  <rect x="23" y="33" width="46" height="22" rx="11" fill="#ffffff" opacity="0.12"/>
  <text x="46" y="64" font-size="22" text-anchor="middle" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">🎮</text>
  <text x="88" y="44" font-size="17" font-weight="700" fill="url(#ac)" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">Games</text>
  <rect x="88" y="52" width="28" height="2" rx="1" fill="url(#ac)" opacity="0.8"/>
  <text x="88" y="72" font-size="13" fill="#c2cbe0" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">Gameplay, UI, effects and maps,</text>
  <text x="88" y="90" font-size="13" fill="#c2cbe0" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">all scripted in Luau</text>
</svg>
